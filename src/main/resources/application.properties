# Common application configuration.
# The datasource itself is defined per-profile (see application-dev.properties
# and application-mysql.properties). The dev (H2 in-memory) profile is active by
# default so the app can run locally without a MySQL server.
spring.profiles.active=dev

# JPA / Hibernate common settings.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
