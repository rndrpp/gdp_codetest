# Dev profile: H2 in-memory database.
# No external database server required; data lives only for the JVM lifetime.
spring.datasource.url=jdbc:h2:mem:codetestdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 web console available at /h2-console when the app is running.
spring.h2.console.enabled=true
