# MySQL profile: connects to a local/remote MySQL server.
# Activate with: --spring.profiles.active=mysql
# The values below are PLACEHOLDERS. Override them for real environments via
# environment variables or an external config (do not commit real credentials).
spring.datasource.url=jdbc:mysql://localhost:3306/codetestdb
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
